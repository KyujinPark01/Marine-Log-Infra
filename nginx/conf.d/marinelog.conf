# 1단계: 인증서 발급 전 (HTTP만)
# 인증서를 받은 뒤에는 nginx/marinelog-https.conf 내용으로 교체한다.

server {
    listen 80;
    server_name marinelog.cloud api.marinelog.cloud;

    # Let's Encrypt 도메인 확인용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }
}
