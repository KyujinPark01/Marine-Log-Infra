# 2단계: 인증서 발급 후 (HTTPS)
# cp nginx/marinelog-https.conf nginx/conf.d/marinelog.conf

# http -> https
server {
    listen 80;
    server_name marinelog.cloud api.marinelog.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 프론트
server {
    listen 443 ssl;
    http2 on;
    server_name marinelog.cloud;

    ssl_certificate     /etc/letsencrypt/live/marinelog.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marinelog.cloud/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 백엔드 API
server {
    listen 443 ssl;
    http2 on;
    server_name api.marinelog.cloud;

    ssl_certificate     /etc/letsencrypt/live/marinelog.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marinelog.cloud/privkey.pem;

    client_max_body_size 20m;   # 사진 업로드

    # 알림(SSE): 버퍼링을 끄고 연결을 길게 유지
    location /api/v1/notifications/subscribe {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
